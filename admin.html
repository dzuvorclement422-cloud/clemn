<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Admin</title>
  <link rel="stylesheet" href="styles.css" />
  <style>.admin-shell{width:min(900px,calc(100% - 36px));margin:70px auto}.login-panel{max-width:430px;margin:12vh auto}.admin-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:32px}.admin-header-actions{display:flex;align-items:center;gap:22px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}.admin-panel{border:1px solid var(--line);padding:24px}.admin-panel h2{font-size:28px;margin-bottom:24px}.admin-form{display:grid;gap:14px}.admin-form label{display:grid;gap:7px;color:var(--muted);font:10px 'DM Mono',monospace;text-transform:uppercase}.admin-form input,.admin-form textarea{width:100%;padding:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:14px Manrope,sans-serif}.admin-actions{display:flex;gap:10px;align-items:center;margin-top:22px}.admin-status{color:var(--accent);font:11px 'DM Mono',monospace}.admin-project{border-top:1px solid var(--line);padding:16px 0}.admin-project strong{display:block;margin-bottom:5px}.admin-project span{color:var(--muted);font:11px 'DM Mono',monospace}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.admin-header{align-items:flex-start;gap:15px;flex-direction:column}.admin-header-actions{flex-wrap:wrap}}</style>
</head>
<body><main class="admin-shell">
  <section class="admin-panel login-panel" id="loginPanel"><p class="section-label">Portfolio admin</p><h1>Sign in.</h1><form class="admin-form" id="loginForm"><label>Username<input name="username" autocomplete="username" required /></label><label>Password<input name="password" type="password" autocomplete="current-password" required /></label><div class="admin-actions"><button class="button button-primary" type="submit">Sign in <span>↗</span></button><span class="admin-status" id="loginStatus"></span></div></form></section>
  <section id="dashboard" hidden>
  <header class="admin-header"><div><p class="section-label">Portfolio admin</p><h1>Manage your site.</h1></div><div class="admin-header-actions"><a class="text-link" href="index.html">View portfolio <span>↗</span></a><button class="button button-quiet" id="logoutButton" type="button">Log out</button></div></header>
  <div class="admin-grid">
    <section class="admin-panel"><h2>Profile</h2><form class="admin-form" id="profileForm"><label>Name<input name="name" required /></label><label>Role<input name="role" required /></label><label>Availability<input name="availability" /></label><label>Bio<textarea name="bio" rows="5" required></textarea></label><label>Location<textarea name="location" rows="2"></textarea></label><label>Profile image URL<input name="imageUrl" type="url" /></label><label>Or upload profile image<input name="imageFile" type="file" accept="image/*" /></label><label>CV URL<input name="cvUrl" type="url" /></label><label>Or upload CV<input name="cvFile" type="file" accept=".pdf,.doc,.docx" /></label><div class="admin-actions"><button class="button button-primary" type="submit">Save profile <span>↗</span></button><span class="admin-status" id="profileStatus"></span></div></form></section>
    <section class="admin-panel"><h2>Add project</h2><form class="admin-form" id="projectForm"><label>Name<input name="title" required /></label><label>Category<input name="category" required /></label><label>Year<input name="year" required /></label><label>Short description<textarea name="description" rows="3" required></textarea></label><label>Details<textarea name="details" rows="5" required></textarea></label><label>Tags<input name="tags" /></label><label>Project URL<input name="projectUrl" type="url" /></label><label>Or upload project file<input name="projectFile" type="file" /></label><div class="admin-actions"><button class="button button-primary" type="submit">Add project <span>↗</span></button><span class="admin-status" id="projectStatus"></span></div></form><div id="projectList"></div></section>
  </div>
  </section>
</main><script src="admin.js"></script></body></html>
